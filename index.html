<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP Movies</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Georgia,'Times New Roman',serif}
header{background:#111;color:white;padding:16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:25px;font-weight:bold;letter-spacing:1px}
.header-actions{display:flex;gap:8px;align-items:center}
.header-actions a{background:#ff9800;color:#111;text-decoration:none;padding:9px 12px;border-radius:4px;font-weight:bold;font-size:13px}
.search-wrap{padding:14px 10px}
#search{width:100%;padding:12px;border:1px solid #ccc;border-radius:5px;font-size:16px;outline:none}
.container{padding:5px 8px 25px}
.movie-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px}
.movie-card{min-width:0;text-align:center;cursor:pointer}
.poster{width:100%;aspect-ratio:.70;object-fit:cover;border:3px solid #ff9800;border-radius:3px;box-shadow:7px 9px 13px #888;display:block;background:#eee}
.movie-date{color:#aaa;font-size:14px;letter-spacing:3px;margin:26px 0 10px;text-transform:uppercase}
.movie-title{font-size:21px;font-weight:bold;line-height:1.18;margin:0 0 12px;overflow-wrap:anywhere}
.empty{text-align:center;padding:35px 10px;color:#777;grid-column:1/-1}
footer{margin-top:25px;background:#111;color:#ddd;padding:18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:Arial,sans-serif}
footer a{color:#ff9800;text-decoration:none;font-weight:bold}
#adminOpen{cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:1000;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal.show{display:flex}
.modal-box{background:white;width:100%;max-width:650px;padding:20px;border-radius:8px;max-height:92vh;overflow-y:auto;position:relative}
.modal-box h2{margin:0 0 15px}
.close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:27px;cursor:pointer}
.field{margin:12px 0}
.field label{display:block;font-weight:bold;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:4px;font-size:15px}
.btn{border:0;padding:11px 15px;border-radius:4px;cursor:pointer;font-weight:bold;margin:4px 2px}
.primary{background:#ff9800;color:#111}
.dark{background:#222;color:white}
.danger{background:#d32f2f;color:white}
.preview-poster{width:100%;max-height:55vh;object-fit:contain;border:3px solid #ff9800;background:#eee}
.preview-title{font-size:22px;font-weight:bold;margin:12px 0}
.preview-date{color:#999;letter-spacing:2px}
.admin-list-item{border:1px solid #ddd;padding:10px;margin:9px 0;display:flex;gap:10px;align-items:center}
.admin-list-item img{width:75px;height:100px;object-fit:cover}
.admin-list-item .info{flex:1;min-width:0}
.admin-list-item strong{overflow-wrap:anywhere}
.status{font-size:12px;color:#16843b}
.status.off{color:#d32f2f}
#watchPage{display:none;padding:12px}
#playerFrame{width:100%;height:65vh;border:0;background:#000}
.watch-title{font-size:22px;font-weight:bold;margin:12px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px 18px;border-radius:5px;display:none;z-index:12000;max-width:90%;text-align:center}
.legal-links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;margin-top:12px;padding-top:12px;border-top:1px solid #444}
.legal-links a{color:#ff9800;text-decoration:none;font-size:13px;cursor:pointer}
.legal-content{line-height:1.7;font-family:Arial,sans-serif;font-size:14px}
.legal-content h2{padding-right:25px}
#passwordGate{position:fixed;inset:0;background:#111;z-index:11000;display:flex;align-items:center;justify-content:center;padding:20px}
.password-box{background:white;padding:28px 22px;width:100%;max-width:380px;text-align:center;border-radius:8px}
.password-box h2{margin-top:0}
.password-box input{width:100%;padding:13px;margin:12px 0;border:1px solid #ccc;border-radius:5px;font-size:16px}
.password-box button{width:100%;padding:13px;background:#ff9800;border:0;border-radius:5px;font-weight:bold;cursor:pointer}
#passwordError{color:red;font-size:14px}
@media(max-width:700px){
 .movie-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
 .movie-title{font-size:18px}
 .movie-date{font-size:12px;margin-top:22px}
 .logo{font-size:21px}
 .header-actions a{font-size:11px;padding:8px}
}
@media(min-width:1100px){
 .container{padding-left:18px;padding-right:18px}
 .movie-grid{gap:28px 22px}
 .movie-title{font-size:23px}
}
</style>
</head>
<body>

<div id="passwordGate">
 <div class="password-box">
  <h2>SP MOVIES</h2>
  <p>Enter password to access the website</p>
  <form id="passwordForm">
   <input type="password" id="sitePassword" placeholder="Enter website password" required>
   <button type="submit">ENTER WEBSITE</button>
  </form>
  <p id="passwordError"></p>
 </div>
</div>

<header>
 <div class="logo">SP MOVIES</div>
 <div class="header-actions">
  <a href="https://t.me/jugaduBaba0" target="_blank" rel="noopener">Telegram Join</a>
 </div>
</header>

<div id="homePage">
 <div class="search-wrap">
  <input id="search" type="search" placeholder="Search Movies..." oninput="renderMovies()">
 </div>
 <main class="container"><div class="movie-grid" id="movieGrid"></div></main>
</div>

<div id="watchPage">
 <button class="btn dark" onclick="goHome()">← Back to Movies</button>
 <h2 class="watch-title" id="watchTitle"></h2>
 <iframe id="playerFrame" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" title="Movie player"></iframe>
</div>

<footer>
 <div>© <span id="year"></span> SP Movies</div>
 <div>
  <a href="https://t.me/jugaduBaba0" target="_blank" rel="noopener">Telegram Join</a>
  <span style="margin:0 7px;color:#777">|</span>
  <a id="adminOpen" onclick="openLogin()">Admin Panel</a>
 </div>
 <nav class="legal-links">
  <a onclick="openLegal('about')">About Us</a>
  <a onclick="openLegal('contact')">Contact Us</a>
  <a onclick="openLegal('disclaimer')">Disclaimer</a>
  <a onclick="openLegal('privacy')">Privacy Policy</a>
  <a onclick="openLegal('terms')">Terms &amp; Conditions</a>
  <a onclick="openLegal('dmca')">DMCA / Copyright</a>
 </nav>
</footer>

<div class="modal" id="previewModal">
 <div class="modal-box" style="text-align:center">
  <button class="close" onclick="closeModal('previewModal')">×</button>
  <img id="previewPoster" class="preview-poster" alt="Movie poster">
  <div class="preview-date" id="previewDate"></div>
  <div class="preview-title" id="previewTitle"></div>
  <button class="btn primary" onclick="playSelected()">▶ Play Now</button>
  <button class="btn dark" onclick="closeModal('previewModal')">Close</button>
 </div>
</div>

<div class="modal" id="loginModal">
 <div class="modal-box">
  <button class="close" onclick="closeModal('loginModal')">×</button>
  <h2>Admin Login</h2>
  <div class="field">
   <label>Admin Password</label>
   <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter admin password">
  </div>
  <button class="btn primary" onclick="loginAdmin()">Login</button>
  <p id="loginError" style="color:red"></p>
 </div>
</div>

<div class="modal" id="adminModal">
 <div class="modal-box">
  <button class="close" onclick="closeAdmin()">×</button>
  <h2>SP Movies Admin Panel</h2>
  <form id="movieForm">
   <input type="hidden" id="editId">
   <div class="field">
    <label>Movie Title</label>
    <input id="movieTitle" required placeholder="Enter movie title">
   </div>
   <div class="field">
    <label>Poster Image URL</label>
    <input id="movieImage" type="url" required placeholder="https://example.com/poster.jpg">
   </div>
   <div class="field">
    <label>Embed Player URL</label>
    <input id="movieEmbed" type="url" required placeholder="https://example.com/embed/...">
   </div>
   <div class="field">
    <label>Publish Status</label>
    <select id="movieStatus">
     <option value="true">Published</option>
     <option value="false">Unpublished</option>
    </select>
   </div>
   <button class="btn primary" type="submit" id="saveBtn">Save Movie</button>
   <button class="btn dark" type="button" onclick="resetForm()">Clear</button>
  </form>
  <hr>
  <h3>Manage Movies</h3>
  <div id="adminMovieList">Loading...</div>
  <button class="btn danger" onclick="logoutAdmin()">Logout</button>
 </div>
</div>

<div class="modal" id="legalModal">
 <div class="modal-box">
  <button class="close" onclick="closeModal('legalModal')">×</button>
  <div class="legal-content" id="legalContent"></div>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://spmovies-api.goadparas2.workers.dev";
const WEBSITE_PASSWORD = "jugad";
const ADMIN_KEY = "spmovies_admin_password";

let movies = [];
let selectedMovieId = null;
let adminLoggedIn = false;

const $ = id => document.getElementById(id);

function showToast(message){
 const t=$("toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(showToast.timer);
 showToast.timer=setTimeout(()=>t.style.display="none",3000);
}

function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function validURL(value){
 try{
  const u=new URL(value);
  return u.protocol==="https:"||u.protocol==="http:";
 }catch(e){return false}
}

function unlockWebsite(){
 if($("sitePassword").value===WEBSITE_PASSWORD){
  sessionStorage.setItem("spmovies_access","yes");
  $("passwordGate").style.display="none";
  $("passwordError").textContent="";
 }else{
  $("passwordError").textContent="Incorrect password. Please try again.";
  $("sitePassword").value="";
 }
}

$("passwordForm").addEventListener("submit",function(e){
 e.preventDefault();
 unlockWebsite();
});

function checkWebsitePassword(){
 $("passwordGate").style.display=
  sessionStorage.getItem("spmovies_access")==="yes"?"none":"flex";
}

function formatDate(value){
 if(!value)return "";
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return String(value);
 return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}).toUpperCase();
}

function normalizeMovie(m){
 return {
  id:String(m.id),
  title:m.title||"",
  poster:m.poster_url||m.poster||"",
  embed:m.embed_url||m.embed||"",
  published:Number(m.published)===1||m.published===true,
  date:formatDate(m.release_date||m.created_at||m.date)
 };
}

async function apiRequest(path,options={}){
 const headers={"Content-Type":"application/json",...(options.headers||{})};
 const adminPassword=sessionStorage.getItem(ADMIN_KEY);
 if(adminPassword)headers["X-Admin-Password"]=adminPassword;

 const response=await fetch(API_URL+path,{...options,headers});
 let data;
 try{data=await response.json()}catch(e){throw new Error("Invalid server response")}

 if(!response.ok){
  throw new Error(data.error||("Request failed: "+response.status));
 }
 return data;
}

async function loadMovies(){
 $("movieGrid").innerHTML='<div class="empty">Loading movies...</div>';
 try{
  const data=await apiRequest("/api/movies");
  movies=Array.isArray(data)?data.map(normalizeMovie):[];
  renderMovies();
 }catch(error){
  $("movieGrid").innerHTML='<div class="empty">Movies could not be loaded. Please refresh.</div>';
  console.error(error);
 }
}

function renderMovies(){
 const grid=$("movieGrid");
 const query=$("search").value.trim().toLowerCase();
 const visible=movies.filter(m=>m.published&&m.title.toLowerCase().includes(query));

 if(!visible.length){
  grid.innerHTML='<div class="empty">No movies found.</div>';
  return;
 }

 grid.innerHTML=visible.map(m=>`
  <article class="movie-card" onclick="openPreview('${escapeHTML(m.id)}')">
   <img class="poster" src="${escapeHTML(m.poster)}" alt="${escapeHTML(m.title)}" loading="lazy">
   <div class="movie-date">${escapeHTML(m.date)}</div>
   <h3 class="movie-title">${escapeHTML(m.title)}</h3>
  </article>
 `).join("");
}

function openPreview(id){
 const movie=movies.find(m=>m.id===id&&m.published);
 if(!movie)return;
 selectedMovieId=id;
 $("previewPoster").src=movie.poster;
 $("previewTitle").textContent=movie.title;
 $("previewDate").textContent=movie.date;
 openModal("previewModal");
}

function playSelected(){
 const movie=movies.find(m=>m.id===selectedMovieId);
 if(!movie)return;
 closeModal("previewModal");
 $("homePage").style.display="none";
 $("watchPage").style.display="block";
 $("watchTitle").textContent=movie.title;
 $("playerFrame").src=movie.embed;
 history.pushState({watch:movie.id},"","?watch="+encodeURIComponent(movie.id));
 window.scrollTo(0,0);
}

function goHome(){
 $("playerFrame").src="about:blank";
 $("watchPage").style.display="none";
 $("homePage").style.display="block";
 history.pushState({},"",location.pathname);
 renderMovies();
}async function openLogin(){
 if(adminLoggedIn){
  await openAdminPanel();
  return;
 }
 $("loginPass").value="";
 $("loginError").textContent="";
 openModal("loginModal");
}

async function loginAdmin(){
 const password=$("loginPass").value;
 if(!password){
  $("loginError").textContent="Enter admin password";
  return;
 }

 try{
  await apiRequest("/api/login",{
   method:"POST",
   body:JSON.stringify({password})
  });

  sessionStorage.setItem(ADMIN_KEY,password);
  adminLoggedIn=true;
  closeModal("loginModal");
  showToast("Admin login successful");
  await openAdminPanel();
 }catch(error){
  $("loginError").textContent=error.message;
 }
}

async function openAdminPanel(){
 try{
  await loadAdminMovies();
  openModal("adminModal");
 }catch(error){
  showToast(error.message);
  sessionStorage.removeItem(ADMIN_KEY);
  adminLoggedIn=false;
 }
}

async function loadAdminMovies(){
 const data=await apiRequest("/api/admin/movies");
 movies=Array.isArray(data)?data.map(normalizeMovie):[];
 renderMovies();
 renderAdminList();
}

function closeAdmin(){
 closeModal("adminModal");
 resetForm();
}

function logoutAdmin(){
 sessionStorage.removeItem(ADMIN_KEY);
 adminLoggedIn=false;
 closeAdmin();
 showToast("Logged out");
}

function resetForm(){
 $("movieForm").reset();
 $("editId").value="";
 $("saveBtn").textContent="Save Movie";
}

$("movieForm").addEventListener("submit",async function(e){
 e.preventDefault();

 if(!adminLoggedIn){
  showToast("Please login first");
  return;
 }

 const id=$("editId").value;
 const title=$("movieTitle").value.trim();
 const poster=$("movieImage").value.trim();
 const embed=$("movieEmbed").value.trim();
 const published=$("movieStatus").value==="true";

 if(!title||!poster||!embed){
  showToast("Please fill all fields");
  return;
 }

 if(!validURL(poster)||!validURL(embed)){
  showToast("Enter valid image and embed URLs");
  return;
 }

 const body={
  title:title,
  poster_url:poster,
  embed_url:embed,
  published:published
 };

 const saveBtn=$("saveBtn");
 saveBtn.disabled=true;
 saveBtn.textContent="Saving...";

 try{
  if(id){
   await apiRequest("/api/movies/"+encodeURIComponent(id),{
    method:"PUT",
    body:JSON.stringify(body)
   });
   showToast("Movie updated successfully");
  }else{
   await apiRequest("/api/movies",{
    method:"POST",
    body:JSON.stringify(body)
   });
   showToast("Movie added successfully");
  }

  resetForm();
  await loadAdminMovies();

 }catch(error){
  showToast(error.message);
 }finally{
  saveBtn.disabled=false;
  saveBtn.textContent=id?"Update Movie":"Save Movie";
 }
});

function renderAdminList(){
 if(!adminLoggedIn)return;

 const list=$("adminMovieList");

 if(!movies.length){
  list.innerHTML="<p>No movies added yet.</p>";
  return;
 }

 list.innerHTML=movies.map(m=>`
  <div class="admin-list-item">
   <img src="${escapeHTML(m.poster)}" alt="">
   <div class="info">
    <strong>${escapeHTML(m.title)}</strong>
    <div class="status ${m.published?"":"off"}">
     ${m.published?"Published":"Unpublished"}
    </div>
    <button class="btn primary" onclick="editMovie('${escapeHTML(m.id)}')">Edit</button>
    <button class="btn dark" onclick="togglePublish('${escapeHTML(m.id)}')">
     ${m.published?"Unpublish":"Publish"}
    </button>
    <button class="btn danger" onclick="deleteMovie('${escapeHTML(m.id)}')">Delete</button>
   </div>
  </div>
 `).join("");
}

function editMovie(id){
 if(!adminLoggedIn)return;

 const m=movies.find(x=>x.id===id);
 if(!m)return;

 $("editId").value=m.id;
 $("movieTitle").value=m.title;
 $("movieImage").value=m.poster;
 $("movieEmbed").value=m.embed;
 $("movieStatus").value=String(m.published);

 $("saveBtn").textContent="Update Movie";
 $("movieTitle").scrollIntoView({behavior:"smooth",block:"center"});
}

async function togglePublish(id){
 if(!adminLoggedIn)return;

 const m=movies.find(x=>x.id===id);
 if(!m)return;

 try{
  await apiRequest("/api/movies/"+encodeURIComponent(id),{
   method:"PUT",
   body:JSON.stringify({
    title:m.title,
    poster_url:m.poster,
    embed_url:m.embed,
    published:!m.published
   })
  });

  await loadAdminMovies();
  showToast(m.published?"Movie unpublished":"Movie published");
 }catch(error){
  showToast(error.message);
 }
}

async function deleteMovie(id){
 if(!adminLoggedIn)return;

 const m=movies.find(x=>x.id===id);
 if(!m)return;

 if(!confirm("Delete "+m.title+"?"))return;

 try{
  await apiRequest("/api/movies/"+encodeURIComponent(id),{
   method:"DELETE"
  });

  await loadAdminMovies();
  showToast("Movie deleted successfully");
 }catch(error){
  showToast(error.message);
 }
}

const legalPages={
 about:`<h2>About SP Movies</h2>
 <p>SP Movies is a movie catalogue website designed to help visitors browse movie listings and access movie-related information.</p>
 <p>SP Movies does not claim ownership of third-party material unless expressly stated.</p>`,

 contact:`<h2>Contact Us</h2>
 <p>For general questions, technical issues or copyright concerns, contact the website administrator.</p>
 <p><strong>Contact email:</strong> Add your working email address here.</p>`,

 disclaimer:`<h2>Disclaimer</h2>
 <p>Information on SP Movies is provided for general informational and catalogue purposes.</p>
 <p>External links and embedded players may be hosted and controlled by third parties. We do not control their content, availability or privacy practices.</p>
 <p>Visitors are responsible for ensuring that their use of external content complies with applicable laws.</p>`,

 privacy:`<h2>Privacy Policy</h2>
 <p>This website may store limited information in your browser, including a temporary website access session.</p>
 <p>Third-party websites and embedded players may collect information under their own privacy policies.</p>
 <p>Contact: Add your working email address here.</p>`,

 terms:`<h2>Terms &amp; Conditions</h2>
 <p>By using SP Movies, you agree to use the website lawfully and responsibly.</p>
 <ul>
  <li>Do not use the website for unlawful activity.</li>
  <li>Do not attempt to disrupt or gain unauthorised access to the website.</li>
  <li>External links and embedded players may have separate terms.</li>
 </ul>`,

 dmca:`<h2>DMCA / Copyright Policy</h2>
 <p>SP Movies respects intellectual property rights and will review properly submitted copyright complaints.</p>
 <p>Send your name, contact information, copyrighted work details and the exact URL of the allegedly infringing material.</p>
 <p>Contact email: Add your working email address here.</p>`
};

function openLegal(page){
 const content=legalPages[page];
 if(!content)return;
 $("legalContent").innerHTML=content;
 openModal("legalModal");
}

$("year").textContent=new Date().getFullYear();

checkWebsitePassword();
loadMovies();

window.addEventListener("popstate",function(){
 const id=new URLSearchParams(location.search).get("watch");

 if(id){
  const movie=movies.find(m=>m.id===id&&m.published);

  if(movie){
   $("homePage").style.display="none";
   $("watchPage").style.display="block";
   $("watchTitle").textContent=movie.title;
   $("playerFrame").src=movie.embed;
   return;
  }
 }

 $("playerFrame").src="about:blank";
 $("watchPage").style.display="none";
 $("homePage").style.display="block";
 renderMovies();
});
</script>
</body>
</html>
